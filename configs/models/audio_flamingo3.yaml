model_name: "nvidia/audio-flamingo-3-hf"
model_type: "audio-flamingo3"

extraction:
  llm:
    method: "hooks"
    selected_layers: [0, 1, 6, 13, 20, 27]
    pooling_strategies: ["mean", "last"]
    # In addition to the LLM layers above, the extractor hooks the audio
    # tower's last encoder layer and the multi-modal projector. Targets are
    # defined in AudioFlamingoEmbeddingExtractor._register_hooks.

training:
  # LoRA on all-linear covers both the LLM and the Whisper encoder.
  # Audio is padded to a fixed 30 s window; see
  # AudioFlamingoAudioDataCollator.MAX_AUDIO_SAMPLES / MAX_FEATURE_LEN.
  lora:
    r: 4
    alpha: 32
    use_rslora: true
    target_modules: "all-linear"
    dropout: 0.1
    bias: "none"
    task_type: "CAUSAL_LM"
