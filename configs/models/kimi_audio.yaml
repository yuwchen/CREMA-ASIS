model_name: "moonshotai/Kimi-Audio-7B-Instruct"
model_type: "kimi_audio"

extraction:
  llm:
    method: "hooks"
    selected_layers: [0, 1, 6, 13, 20, 27]
    pooling_strategies: ["mean", "last"]
    # In addition to the LLM layers above, the extractor hooks the Whisper
    # speech encoder, the VQ adaptor ("projector"), and the first MIMO layer.
    # Targets are defined in KimiAudioEmbeddingExtractor._register_hooks.

training:
  # LoRA is applied to the ALM only; the Whisper encoder stays frozen.
  lora:
    r: 4
    alpha: 32
    use_rslora: true
    target_modules: "all-linear"
    dropout: 0.1
    bias: "none"
    task_type: "CAUSAL_LM"
