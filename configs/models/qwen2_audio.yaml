model_name: "Qwen/Qwen2-Audio-7B-Instruct"
model_type: "qwen2_audio"

extraction:
  llm:
    method: "output_hidden_states"
    selected_layers: [0, 1, 8, 16, 24, -1]
    pooling_strategies: ["mean", "last"]
  # Audio tower + multi-modal projector, extracted together in one forward
  # pass. `selected_layers` names what is emitted rather than indexing the
  # encoder: the audio tower's last hidden state, and that state after the
  # projector. Matches the "whisper"/"projector" keys the other two models use.
  whisper:
    method: "modules"
    selected_layers: ["whisper", "projector"]
    pooling_strategies: ["mean", "last"]

training:
  # LoRA on all-linear covers both the LLM and the Whisper encoder.
  lora:
    r: 4
    alpha: 32
    use_rslora: true
    target_modules: "all-linear"
    dropout: 0.1
    bias: "none"
    task_type: "CAUSAL_LM"
